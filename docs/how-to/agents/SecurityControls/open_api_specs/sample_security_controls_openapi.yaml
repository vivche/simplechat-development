openapi: 3.1.0
info:
  title: NIST SP 800-53 Security Controls API
  description: >
    Provides access to the NIST SP 800-53 Rev 5 security and privacy control
    catalog via the Security Controls Azure Function. Use this API to browse
    control families, list controls within a family, search controls by name or
    description text, and look up individual controls by identifier
    (e.g. AC-1, AC-2(3), SI-4).
  version: 1.0.0

servers:
  - url: https://func-security-plugin-dev.azurewebsites.us/api
    description: Security Controls Azure Function (replace with your deployed function URL)

# This function app is currently deployed with anonymous authentication — no API key or token is required.
# When moving to production, uncomment the security block below and configure the appropriate auth scheme.

# --- FUTURE AUTH: Uncomment when enabling function-level key authentication ---
# security:
#   - functionKey: []
# ------------------------------------------------------------------------------

paths:

  /controls:
    get:
      operationId: listControls
      summary: Search and list security controls
      description: >
        Returns NIST SP 800-53 Rev 5 controls with optional filtering and
        pagination. Use 'name' to search control names and 'description' to
        search control text and discussion fields (both case-insensitive
        substring matches). Use 'skip' and 'limit' to paginate results.
        The response includes 'total' so you know whether more pages are
        available. To retrieve all controls in a known family, prefer the
        /families/{prefix} endpoint.
      parameters:
        - name: name
          in: query
          required: false
          description: >
            Case-insensitive substring to match against control names.
            Example: "access" returns controls whose name contains "access".
          schema:
            type: string
          example: "access"

        - name: description
          in: query
          required: false
          description: >
            Case-insensitive substring to match against control text and
            discussion fields. Example: "encryption" returns controls whose
            text or discussion mentions "encryption".
          schema:
            type: string
          example: "encryption"

        - name: skip
          in: query
          required: false
          description: Number of matching controls to skip (for pagination). Default is 0.
          schema:
            type: integer
            minimum: 0
            default: 0
          example: 0

        - name: limit
          in: query
          required: false
          description: >
            Maximum number of controls to return per page. Default is 50,
            maximum is 200. Use together with 'skip' and the 'total' field in
            the response to paginate through large result sets.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          example: 50

      responses:
        "200":
          description: Paginated array of control summaries with total count
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    description: Total number of controls matching the filters
                  skip:
                    type: integer
                    description: Number of controls skipped
                  limit:
                    type: integer
                    description: Page size used
                  controls:
                    type: array
                    description: Array of control summary objects
                    items:
                      type: object
                      properties:
                        identifier:
                          type: string
                          description: "Control identifier, e.g. AC-1, SI-4(2)"
                        name:
                          type: string
                          description: Human-readable control name

  /controls/{identifier}:
    get:
      operationId: getSecurityControl
      summary: Get a specific NIST SP 800-53 security control
      description: >
        Retrieve the full details of a single NIST SP 800-53 Rev 5 control by
        its identifier. Returns the control text, supplemental discussion, and
        related control references. The identifier is case-insensitive.
        Use this after listControls or getControlsByFamily to drill into a
        specific control.
      parameters:
        - name: identifier
          in: path
          required: true
          description: >
            The NIST SP 800-53 control identifier. Case-insensitive.
            Examples: AC-1, AC-2(3), SI-4, IA-5(1).
          schema:
            type: string
          example: "AC-1"

      responses:
        "200":
          description: Full control record including text, discussion, and related controls
          content:
            application/json:
              schema:
                type: object
                properties:
                  identifier:
                    type: string
                    description: "Control identifier, e.g. AC-1"
                  name:
                    type: string
                    description: Human-readable control name
                  control_text:
                    type: string
                    description: The normative control requirement text
                  discussion:
                    type: string
                    description: Supplemental guidance and discussion for the control
                  related:
                    type: string
                    description: Comma-separated list of related control identifiers
        "404":
          description: Control not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /families:
    get:
      operationId: listFamilies
      summary: List all NIST SP 800-53 control families
      description: >
        Returns the 20 NIST SP 800-53 Rev 5 control families with their
        two-letter prefix, full name, and the number of controls in each.
        Use a family prefix with the /families/{prefix} endpoint to list all
        controls in that family. Call this endpoint first to discover valid
        family prefixes.
      responses:
        "200":
          description: Array of control family summaries
          content:
            application/json:
              schema:
                type: object
                properties:
                  families:
                    type: array
                    description: List of all NIST SP 800-53 control families
                    items:
                      type: object
                      properties:
                        prefix:
                          type: string
                          description: "Two-letter family prefix, e.g. AC, SI, AU"
                        name:
                          type: string
                          description: Full family name
                        count:
                          type: integer
                          description: Number of controls in this family

  /families/{prefix}:
    get:
      operationId: getControlsByFamily
      summary: List all controls in a NIST SP 800-53 control family
      description: >
        Returns all controls belonging to the specified family, identified by
        its two-letter prefix (e.g. AC, AU, SI). The response includes the
        family name and an array of control summaries. The prefix is
        case-insensitive. Use listFamilies first to discover available prefixes.
      parameters:
        - name: prefix
          in: path
          required: true
          description: >
            Two-letter NIST SP 800-53 family prefix. Case-insensitive.
            Examples: AC (Access Control), AU (Audit and Accountability),
            SI (System and Information Integrity), IA (Identification and
            Authentication), CM (Configuration Management).
          schema:
            type: string
          example: "AC"

      responses:
        "200":
          description: Family details with full list of control summaries
          content:
            application/json:
              schema:
                type: object
                properties:
                  prefix:
                    type: string
                    description: Two-letter family prefix
                  name:
                    type: string
                    description: Full family name
                  controls:
                    type: array
                    description: All controls in this family
                    items:
                      type: object
                      properties:
                        identifier:
                          type: string
                          description: "Control identifier, e.g. AC-1, AC-2(3)"
                        name:
                          type: string
                          description: Human-readable control name
        "404":
          description: Family not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

