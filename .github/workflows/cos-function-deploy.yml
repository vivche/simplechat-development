# ─────────────────────────────────────────────────────────────────────────────
# Workflow: COS Deploy Function App
#
# Reused from vivche/security-plugin (function-deploy.yml), adapted for the
# chief-of-staff-runtime component inside the microsoft/simplechat repo
# (COS_-prefixed secrets/variables).
#
# Triggers:
#   • Automatically – after "COS Build and Push Docker Image" succeeds on main
#   • Manual dispatch – supply an image tag (defaults to "latest")
#
# Image tag resolution:
#   • workflow_run trigger → commit SHA from the build run (exact image)
#   • workflow_dispatch    → the tag you supply (or "latest")
#
# Secrets required:
#   COS_AZURE_CREDENTIALS – SP JSON (az ad sp create-for-rbac --sdk-auth)
#
# Variables required (set automatically by COS Deploy Infrastructure, or manually):
#   COS_FUNCTION_APP_NAME – e.g. func-cos-runtime-dev
#   COS_RESOURCE_GROUP    – e.g. cos-runtime-dev-rg
#   COS_ACR_LOGIN_SERVER  – ACR login server (e.g. acrcosruntimexxxxxx.azurecr.us)
# ─────────────────────────────────────────────────────────────────────────────
name: COS Deploy Function App

on:
  workflow_run:
    workflows: ["COS Build and Push Docker Image"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image-tag:
        description: 'Image tag to deploy (e.g. a3f9c12... or "latest")'
        required: false
        default: 'latest'

permissions:
  contents: read

env:
  IMAGE_NAME: cos-runtime
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Function App deploy
    runs-on: ubuntu-latest
    # Skip if triggered by a failed build run
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      # ── Resolve the image tag ────────────────────────────────────────────────
      - name: Resolve image tag
        id: tag
        run: |
          if [ -n "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "value=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
          else
            echo "value=${{ inputs.image-tag }}" >> $GITHUB_OUTPUT
          fi

      # ── Authenticate to Azure ────────────────────────────────────────────────
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.COS_AZURE_CREDENTIALS }}
          environment: AzureUSGovernment

      # ── Point the Function App at the new image ──────────────────────────────
      - name: Update Function App container image
        run: |
          az functionapp config container set \
            --name           "${{ vars.COS_FUNCTION_APP_NAME }}" \
            --resource-group "${{ vars.COS_RESOURCE_GROUP }}" \
            --image          "${{ vars.COS_ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.value }}"

      # ── Restart to pick up the new image immediately ─────────────────────────
      - name: Restart Function App
        run: |
          az functionapp restart \
            --name           "${{ vars.COS_FUNCTION_APP_NAME }}" \
            --resource-group "${{ vars.COS_RESOURCE_GROUP }}"

      # ── Verify the app is running ────────────────────────────────────────────
      - name: Verify Function App is running
        run: |
          state=$(az functionapp show \
            --name           "${{ vars.COS_FUNCTION_APP_NAME }}" \
            --resource-group "${{ vars.COS_RESOURCE_GROUP }}" \
            --query          "state" \
            --output         tsv)
          echo "Function App state: $state"
          if [ "$state" != "Running" ]; then
            echo "::error::Function App is not in Running state after deploy."
            exit 1
          fi
