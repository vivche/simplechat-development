# ─────────────────────────────────────────────────────────────────────────────
# Workflow: COS Deploy Infrastructure (Bicep)
#
# Reused from vivche/security-plugin (infra-deploy.yml), adapted for the
# chief-of-staff-runtime component living inside the microsoft/simplechat repo:
#   • path triggers scoped to chief-of-staff-runtime/infra/** (monorepo-safe)
#   • secrets/variables prefixed COS_ to avoid collisions with SimpleChat CI
#
# Prerequisites – set these once in the GitHub repo:
#   Secrets  : COS_AZURE_CREDENTIALS – JSON output of:
#                az cloud set --name AzureUSGovernment
#                az ad sp create-for-rbac --name "gh-cos-runtime-deploy" \
#                  --role Contributor \
#                  --scopes /subscriptions/<sub-id> \
#                  --sdk-auth
#              Then also assign "User Access Administrator" on the subscription
#              so the SP can create the RBAC role assignments in the template:
#                az role assignment create \
#                  --assignee <appId> \
#                  --role "User Access Administrator" \
#                  --scope /subscriptions/<sub-id>
# ─────────────────────────────────────────────────────────────────────────────
name: COS Deploy Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'chief-of-staff-runtime/infra/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-infra:
    name: Bicep – subscription-scoped deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Authenticate to Azure (service principal JSON secret) ─────────────────
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.COS_AZURE_CREDENTIALS }}
          environment: AzureUSGovernment

      # ── Validate the Bicep template before deploying ─────────────────────────
      - name: Validate Bicep
        uses: azure/arm-deploy@v2
        with:
          scope:          subscription
          region:         usgovvirginia
          subscriptionId: ${{ fromJson(secrets.COS_AZURE_CREDENTIALS).subscriptionId }}
          deploymentName: cos-infra-validate-${{ github.run_id }}
          template:       ./chief-of-staff-runtime/infra/main.bicep
          parameters:     ./chief-of-staff-runtime/infra/main.bicepparam
          deploymentMode: Validate

      # ── Deploy infrastructure ─────────────────────────────────────────────────
      - name: Deploy Bicep
        id: deploy
        uses: azure/arm-deploy@v2
        with:
          scope:          subscription
          region:         usgovvirginia
          subscriptionId: ${{ fromJson(secrets.COS_AZURE_CREDENTIALS).subscriptionId }}
          deploymentName: cos-infra-${{ github.run_id }}
          template:       ./chief-of-staff-runtime/infra/main.bicep
          parameters:     ./chief-of-staff-runtime/infra/main.bicepparam
          deploymentMode: Incremental

      # ── Capture outputs and store as repository variables ────────────────────
      # Consumed by the docker-build and function-deploy workflows.
      - name: Update GitHub repository variables
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:     ${{ github.repository }}
        run: |
          set_var() {
            gh variable set "$1" --body "$2" --repo "$REPO" || true
          }
          set_var COS_ACR_NAME          "${{ steps.deploy.outputs.acrName }}"
          set_var COS_ACR_LOGIN_SERVER  "${{ steps.deploy.outputs.acrLoginServer }}"
          set_var COS_FUNCTION_APP_NAME "${{ steps.deploy.outputs.functionAppName }}"
          set_var COS_RESOURCE_GROUP    "${{ steps.deploy.outputs.resourceGroupName }}"
